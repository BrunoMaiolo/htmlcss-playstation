<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStation</title>
    <!--Css-->
    <link rel="stylesheet" href="./style.css">
    <!--Bootstrap 5-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
</head>
<body>
   <header class="sticky-top">
      <!-- Barra SONY -->
      <div class="sony-bar text-end px-3">
        <span>SONY</span>
      </div>
      
      <!-- Navbar principale -->
      <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
          <!-- Logo PlayStation -->
          <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="./img/play_logo.svg" alt="PlayStation" height="28">
          </a>

          <!-- Toggler mobile -->
          <button class="navbar-toggler border-0" type="button"
                  data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                  aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <img src="./img/play-menu-icon.png" alt="Menu" height="22">
          </button>

          <!-- Link di navigazione -->
          <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 main-nav">
  <li class="nav-item">
    <a class="nav-link d-flex align-items-center gap-1" href="#">
      Giochi
      <img src="./img/chevron-down-solid.svg" alt="" class="nav-chevron">
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link d-flex align-items-center gap-1" href="#">
      Hardware
      <img src="./img/chevron-down-solid.svg" alt="" class="nav-chevron">
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link d-flex align-items-center gap-1" href="#">
      Servizi
      <img src="./img/chevron-down-solid.svg" alt="" class="nav-chevron">
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link d-flex align-items-center gap-1" href="#">
      Novità
      <img src="./img/chevron-down-solid.svg" alt="" class="nav-chevron">
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link d-flex align-items-center gap-1" href="#">
      Negozi
      <img src="./img/chevron-down-solid.svg" alt="" class="nav-chevron">
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link d-flex align-items-center gap-1" href="#">
      Più supporto
      <img src="./img/chevron-down-solid.svg" alt="" class="nav-chevron">
    </a>
  </li>
</ul>


            <div class="d-flex align-items-center gap-3">
              <button class="btn btn-outline-dark btn-sm rounded-pill">
                Accedi
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>

        <!--RETURNAL-->
        <section class="hero-returnal text-white position-relative">
        <div class="hero-overlay"></div>

        <div class="container h-100">
          <!-- Logo del gioco -->
          <img src="./img/returnal-hero-banner-logo.png"
               alt="Returnal"
               class="hero-game-logo mb-3">

          <!-- Testi hero -->
          <h1 class="display-6 fw-bold mb-2">Rompi il cerchio</h1>

          <p class="hero-text mb-3">
            Ribellati dopo ogni sconfitta e affronta una nuova sfida ad ogni rinascita in questo
            sparatutto roguelike in esclusiva per PS5.
          </p>

          <!-- Bottone arancione -->
          <button class="btn btn-danger text-white fw-semibold hero-cta">
  Acquista ora
</button>

        </div>
      </section>
    
</body>
</html>
